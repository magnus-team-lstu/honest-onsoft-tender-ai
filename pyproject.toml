[project]
name = "honest-onsoft-tender-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.16",
    "openai>=3.46.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
dashboard = "dashboard.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "dashboard"]

[tool.pytest.ini_options]
pythonpath = ["."]
