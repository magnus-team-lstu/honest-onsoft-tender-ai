[project]
name = "honest-onsoft-tender-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.16",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
